name: Assemble FloraLab 1.4 RC

on:
  push:
    branches:
      - 'release/1.4.0'
    paths:
      - '.github/rc-ui-1.4.py.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.4.0
          fetch-depth: 0

      - name: Assemble exact locally accepted release sources
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, json

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          payload = Path('.github/rc-ui-1.4.py.gz.b64').read_text(encoding='utf-8').strip()
          Path('qa/ui_1_4.py').write_bytes(gzip.decompress(base64.b64decode(payload)))

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          package['version'] = '1.4.0'
          package['description'] = 'FloraLab Studio 1.4.0 Foundation & Creative Flow - idea-first directions, lock-aware variations, branch compare, floralab v2'
          package['scripts']['test:ui'] = 'python qa/ui_1_4.py'
          Path('package.json').write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace('docs/DEVELOPMENT_WORKFLOW.md', '完整 48 页发布 Gate', '完整发布 Gate')
          replace('docs/DEVELOPMENT_WORKFLOW.md', '1.4 会把现在单个 `ui_1_3.py` 继续拆成互相独立的页面/功能测试，避免一个流程的状态污染另一个流程。', '1.4 已新增 `ui_1_4.py` 作为 54 页完整发布 Gate，并继续用 FAST / TARGETED 做日常增量验证。后续再把完整 Gate 按页面族进一步拆分，避免一个长流程的状态污染另一个流程。')
          replace('CHANGELOG.md', '## 1.4.0 — Foundation & Creative Flow (development)', '## 1.4.0 — Foundation & Creative Flow')
          replace('public/service-worker.js', "const CACHE='floralab-1.3.1-shell-refresh';", "const CACHE='floralab-1.4.0-shell-refresh';")
          replace('public/service-worker.js', "'./library.js','./app.js'", "'./library.js','./core/storage.js','./core/shell.js','./views/home.js','./views/create.js','./views/explore.js','./app.js'")
          replace('public/style.css', '/* FloraLab 1.3.1 · approved landing cover */', '/* FloraLab · approved landing cover */')

          qa_report = base64.b64decode('').decode('utf-8')
          Path('QA_REPORT.md').write_text(qa_report, encoding='utf-8')

      - name: Verify assembled release inputs
        run: |
          test -f qa/ui_1_4.py
          grep -q '"version": "1.4.0"' package.json
          grep -q 'test:ui.*ui_1_4.py' package.json

      - name: Commit assembled release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare FloraLab Studio 1.4.0 release candidate [assembled]"
          git push origin HEAD:release/1.4.0
