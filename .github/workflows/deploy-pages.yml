name: Deploy FloraLab Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v141-sprout-identity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependency
        run: python -m pip install --disable-pip-version-check pillow cairosvg playwright

      - name: Install CJK font for visual gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Material visual source audit
        run: python qa/material_visual_sources.py

      - name: Release tests
        shell: bash
        run: |
          set +e
          npm run test:release > release-test.log 2>&1
          code=$?
          cat release-test.log
          {
            echo "## FloraLab release tests"
            echo
            echo '~~~text'
            tail -n 160 release-test.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error title=FloraLab release tests failed::See the job summary for the exact test output."
            exit "$code"
          fi

      - name: Page-by-page visual gate
        run: npm run test:ui && npm run test:storage

      - name: Upload visual acceptance pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floralab-1.6.0-visual-pages
          path: |
            qa/acceptance-1.6/D*.png
            qa/acceptance-1.6/M*.png
            qa/acceptance-1.6/acceptance.json
            qa/material-visual-sources.json
            qa/material-visual-sheet-*.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install online QA dependency
        run: python -m pip install --disable-pip-version-check playwright

      - name: Install CJK font for online visual gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Verify deployed FloraLab page by page
        env:
          FLORALAB_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:ui && npm run test:storage

      - name: Upload online visual acceptance pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floralab-1.6.0-online-visual-pages
          path: |
            qa/acceptance-1.6/D*.png
            qa/acceptance-1.6/M*.png
            qa/acceptance-1.6/acceptance.json
