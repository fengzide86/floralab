name: Deploy FloraLab Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependency
        run: python -m pip install --disable-pip-version-check pillow cairosvg playwright

      - name: Install Chromium for visual gate
        run: python -m playwright install --with-deps chromium

      - name: Release tests
        shell: bash
        run: |
          set +e
          npm run test:release > release-test.log 2>&1
          code=$?
          cat release-test.log
          {
            echo "## FloraLab release tests"
            echo
            echo '~~~text'
            tail -n 160 release-test.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error title=FloraLab release tests failed::See the job summary for the exact test output."
            exit "$code"
          fi

      - name: Page-by-page visual gate
        run: python qa/ui_1_2.py

      - name: Upload visual acceptance pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floralab-1.2-visual-pages
          path: |
            qa/1.2-D*.png
            qa/1.2-M*.png
            qa/ui-1.2.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
