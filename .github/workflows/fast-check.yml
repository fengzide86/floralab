name: FloraLab Fast Check

on:
  push:
    branches:
      - 'dev/1.4-*'
      - 'feature/**'
  pull_request:
    branches:
      - 'dev/1.4-*'

permissions:
  contents: read

concurrency:
  group: floralab-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Fast source and regression check
        run: npm run check:fast
