name: FloraLab Targeted UI

on:
  push:
    branches:
      - 'dev/1.4-*'
      - 'feature/**'
    paths:
      - 'public/**'
      - 'lib/**'
      - 'scripts/build-runtime.js'
      - 'scripts/build-service-worker.js'
      - 'qa/ui_smoke_1_4.py'
      - 'package.json'
      - '.github/workflows/targeted-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floralab-targeted-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check playwright

      - name: Build browser runtime
        run: npm run build:runtime

      - name: Targeted browser smoke
        run: npm run test:ui:smoke

      - name: Upload targeted screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floralab-targeted-ui
          path: |
            qa/targeted/*.png
            qa/targeted/ui-smoke-1.4.json
