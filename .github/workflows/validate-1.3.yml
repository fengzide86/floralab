name: Validate FloraLab 1.3

on:
  push:
    branches:
      - dev/floralab-1.3-render-handoff
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floralab-v13-render-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg playwright

      - name: Install CJK font for visual gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Material visual source audit
        run: python qa/material_visual_sources.py

      - name: Release tests
        run: npm run test:release

      - name: Page-by-page visual gate
        run: python qa/ui_1_3.py

      - name: Upload 1.3 visual acceptance pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floralab-1.3-dev-visual-pages
          path: |
            qa/1.3-D*.png
            qa/1.3-M*.png
            qa/ui-1.3.json
            qa/material-visual-sources.json
            qa/material-visual-sheet-*.jpg
