name: Validate FloraLab Release Candidate

on:
  push:
    branches:
      - 'dev/**'
      - 'fix/**'
      - '!dev/1.4-*'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floralab-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg playwright

      - name: Install CJK font for visual gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Material visual source audit
        run: python qa/material_visual_sources.py

      - name: Release tests
        run: npm run test:release

      - name: Page-by-page visual gate
        run: npm run test:ui && npm run test:storage

      - name: Upload 1.4.1 visual acceptance pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floralab-1.6.0-rc-visual-pages
          path: |
            qa/acceptance-1.6/D*.png
            qa/acceptance-1.6/M*.png
            qa/acceptance-1.6/acceptance.json
            qa/material-visual-sources.json
            qa/material-visual-sheet-*.jpg
